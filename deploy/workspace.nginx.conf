# Merge into the existing server block in trading-journal.conf.
# Remove old root/static/API locations that would bypass these protected routes.
# Existing TLS listen/certificate settings should be retained.
server {
    listen 80;
    server_name 52.66.251.235;
    client_max_body_size 12m;

    location = /_portal_verify {
        internal;
        proxy_pass http://127.0.0.1:5001/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /verify { return 404; }
    location = /journal { return 302 /journal/; }
    location = /fnoanalyzer { return 302 /fnoanalyzer/; }

    location ^~ /journal/ {
        auth_request /_portal_verify;
        auth_request_set $journal_authorization $upstream_http_x_journal_authorization;
        error_page 401 =302 /login;
        proxy_set_header Authorization $journal_authorization;
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /fnoanalyzer/ {
        auth_request /_portal_verify;
        error_page 401 =302 /login;
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
